<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orthodoxy or Heresy?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0b1a33; --navy2:#13284d; --navy3:#1d3866; --gold:#d4af37; --gold2:#f0d27a;
  --cream:#f7f2e4; --red:#c0392b; --red2:#e0574a; --green:#2e8b57; --ink:#0b1a33; --muted:#a9b6cf;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,var(--navy3),var(--navy) 70%);color:var(--cream);
  font-family:"Source Sans 3",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,.cinzel{font-family:Cinzel,Georgia,serif;letter-spacing:.02em}
button{font-family:inherit;cursor:pointer;border:0}
#app{min-height:100vh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:24px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.logo{font-family:Cinzel,serif;font-weight:800;line-height:1.05}
.logo .o{color:var(--gold)} .logo .h{color:var(--red2)}
.btn{background:var(--gold);color:var(--navy);font-weight:800;font-size:1.15rem;padding:14px 28px;border-radius:12px;
  box-shadow:0 4px 0 #8a6d14;transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6d14}
.btn.ghost{background:transparent;color:var(--gold);border:2px solid var(--gold);box-shadow:none}
.btn.small{font-size:.95rem;padding:8px 16px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--cream);color:var(--ink);border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
input{font:inherit;font-size:1.3rem;padding:14px 16px;border-radius:12px;border:2px solid var(--navy3);width:100%;
  background:#fff;color:var(--ink);text-align:center}
input:focus{outline:3px solid var(--gold);border-color:var(--gold)}
.err{color:var(--red2);font-weight:700;min-height:1.4em;margin-top:10px}
.muted{color:var(--muted)}
.link{background:none;color:var(--muted);text-decoration:underline;font-size:.95rem;padding:6px}

/* host bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;background:rgba(0,0,0,.25);
  border-bottom:2px solid rgba(212,175,55,.35)}
.bar .logo{font-size:1.4rem}
.chip{background:var(--gold);color:var(--navy);font-weight:800;border-radius:999px;padding:6px 16px;font-size:1.1rem}
.chip.dark{background:var(--navy3);color:var(--gold2)}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:28px;align-items:start}
.joinbox{text-align:center}
.joinbox .code{font-family:Cinzel,serif;font-size:5rem;font-weight:800;letter-spacing:.12em;color:var(--navy);line-height:1}
.joinbox .url{font-weight:700;word-break:break-all;font-size:1rem;margin:6px 0 14px}
#qr{display:flex;justify-content:center;margin:14px 0}
#qr img,#qr canvas{border:8px solid #fff;border-radius:8px}
.players{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.pchip{background:var(--navy3);border:2px solid var(--gold);color:var(--cream);padding:8px 14px;border-radius:999px;font-weight:700;font-size:1.1rem}
.pchip.off{opacity:.45;border-style:dashed}
.pchip button{background:none;color:var(--red2);font-weight:800;margin-left:6px;font-size:1rem}
.settings{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:18px 0}
.settings label{display:flex;gap:8px;align-items:center;font-weight:600}
select{font:inherit;padding:6px 10px;border-radius:8px}

/* question */
.roundtag{font-family:Cinzel,serif;color:var(--gold);font-size:1.3rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.statement{font-size:clamp(1.5rem,2.6vw,2.4rem);line-height:1.35;font-weight:600;position:relative}
.statement::before{content:"\201C";font-family:Cinzel,serif;color:var(--gold);font-size:5rem;position:absolute;left:-10px;top:-40px;opacity:.6}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:26px;flex-wrap:wrap}
.timer{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:Cinzel,serif;font-size:2.6rem;font-weight:800;color:var(--navy);background:conic-gradient(var(--gold) var(--p,100%),rgba(255,255,255,.15) 0)}
.timer span{background:var(--cream);width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.answered{font-size:1.6rem;font-weight:800}
.answered b{color:var(--gold);font-size:2.4rem}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.choice{border-radius:16px;padding:18px;font-family:Cinzel,serif;font-weight:800;font-size:1.6rem;text-align:center}
.choice.o{background:var(--gold);color:var(--navy)} .choice.h{background:var(--red);color:#fff}

/* reveal */
.reveal{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
.verdict{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:16px}
.stamp{font-family:Cinzel,serif;font-weight:800;font-size:3rem;padding:6px 22px;border:6px solid;border-radius:12px;transform:rotate(-4deg);
  animation:stamp .35s ease-out}
.stamp.h{color:var(--red2);border-color:var(--red2)} .stamp.o{color:var(--gold);border-color:var(--gold)}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(-4deg);opacity:1}}
.label{font-size:1.5rem;font-weight:800;color:var(--gold2)}
.bars{display:grid;gap:10px;margin:8px 0 18px}
.vbar{display:grid;grid-template-columns:130px 1fr 60px;align-items:center;gap:12px;font-weight:800;font-size:1.1rem}
.vbar .track{background:rgba(255,255,255,.12);border-radius:8px;height:34px;overflow:hidden}
.vbar .fill{height:100%;border-radius:8px;transition:width .8s ease}
.vbar.o .fill{background:var(--gold)} .vbar.h .fill{background:var(--red)}
.vbar.right .name::after{content:" \2713";color:#7ee2a8}
.trap h3{margin:0 0 8px;color:var(--red);font-size:1.3rem}
.trap p{font-size:1.3rem;line-height:1.5;margin:0}
.refs{margin-top:14px;font-weight:700;color:var(--navy3);font-size:1.05rem}
.board{background:rgba(0,0,0,.25);border:2px solid rgba(212,175,55,.4);border-radius:16px;padding:16px}
.board h3{margin:0 0 10px;color:var(--gold);font-size:1.1rem}
.row{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:700}
.row .sc{color:var(--gold2)}

/* final */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:20px 0 30px}
.pod{width:200px;text-align:center}
.pod .blk{border-radius:12px 12px 0 0;background:linear-gradient(var(--gold2),var(--gold));color:var(--navy);font-family:Cinzel,serif;font-weight:800;font-size:2.4rem;display:flex;align-items:flex-start;justify-content:center;padding-top:10px}
.pod .nm{font-weight:800;font-size:1.3rem;margin-bottom:4px;word-break:break-word}
.pod .s{color:var(--gold2);font-weight:700;margin-bottom:8px}
.meter{display:flex;height:46px;border-radius:12px;overflow:hidden;font-weight:800;font-size:1.1rem;margin:10px 0}
.meter div{display:flex;align-items:center;justify-content:center;transition:width 1s}
.meter .o{background:var(--gold);color:var(--navy)} .meter .h{background:var(--red);color:#fff}
.twist{border-left:6px solid var(--gold);padding:14px 18px;background:rgba(212,175,55,.12);border-radius:8px;font-size:1.2rem;line-height:1.45;margin-top:18px}
table{width:100%;border-collapse:collapse;color:var(--ink)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #ddd}
th{background:var(--navy);color:var(--gold2)}

/* player */
.pscreen{flex:1;display:flex;flex-direction:column;padding:18px;gap:14px;max-width:760px;width:100%;margin:0 auto}
.ptop{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.pstate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
.pstatement{background:var(--cream);color:var(--ink);border-radius:16px;padding:18px;font-size:1.2rem;line-height:1.45;font-weight:600}
.pbtns{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:700px){.pbtns{grid-template-columns:1fr 1fr}}
.pbtn{border-radius:20px;padding:30px 16px;font-family:Cinzel,serif;font-weight:800;font-size:2rem;min-height:130px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.pbtn small{font-family:"Source Sans 3",sans-serif;font-size:1rem;font-weight:600;opacity:.85}
.pbtn.o{background:var(--gold);color:var(--navy)} .pbtn.h{background:var(--red);color:#fff}
.pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.big{font-family:Cinzel,serif;font-size:2.4rem;font-weight:800;line-height:1.1}
.result{border-radius:20px;padding:22px;text-align:center}
.result.good{background:var(--gold);color:var(--navy)} .result.bad{background:var(--red);color:#fff} .result.miss{background:var(--navy3)}
.score2{display:flex;gap:12px;justify-content:center}
.score2 div{flex:1;border-radius:14px;padding:12px;text-align:center;font-weight:800}
.score2 .o{background:rgba(212,175,55,.2);border:2px solid var(--gold)} .score2 .h{background:rgba(192,57,43,.2);border:2px solid var(--red2)}
.score2 b{display:block;font-size:2rem;font-family:Cinzel,serif}
.spin{width:44px;height:44px;border:5px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{background:var(--red);color:#fff;text-align:center;padding:8px;font-weight:700}
@media (max-width:900px){.lobby,.reveal{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   ROUNDS — edit here. answer: "H" = Heresy, "O" = Orthodox
   ========================================================= */
const ROUNDS = [
  { title:"The Ultimate Example",
    statement:"Jesus is the absolute highest peak of what a human being can achieve. He was so completely filled with the Holy Spirit and so perfectly in tune with God that He became the perfect reflection of the Divine for us.",
    answer:"H", label:"Adoptionism / Pelagianism hybrid",
    trap:"This sounds like a great compliment to Jesus, but it implies He is just a highly evolved, super-holy human who “achieved” connection with God. Jesus isn’t a man who climbed up to become like God; He is God who came down to become man.",
    refs:"CCC 464–465" },
  { title:"The Mother Question",
    statement:"Mary is truly the Mother of God. She didn’t just give birth to Jesus’ human body — she gave birth to a Person, and that Person is God the Son.",
    answer:"O", label:"Theotokos — Council of Ephesus (431)",
    trap:"It can sound like we’re saying Mary existed before God — but that’s not what it means. A mother doesn’t give birth to a “nature”; she gives birth to a person. The Person in Mary’s womb was the eternal Son of God. That’s why the Church calls her Theotokos, “God-bearer,” and why Elizabeth greets her as “the mother of my Lord.”",
    refs:"CCC 495, 509 · Luke 1:43" },
  { title:"The Logic of Good Friday",
    statement:"When Jesus was nailed to the Cross on Good Friday, His human body suffered and died, but His divine nature was entirely unaffected by the pain and remained perfectly happy and untouched in heaven.",
    answer:"H", label:"Nestorianism",
    trap:"It sounds logical because God’s divine nature cannot feel physical pain. However, Jesus cannot be split into two separate compartments. Because He is one single Person, the Person who suffered on the Cross was indeed God the Son. God truly tasted human suffering; He didn’t just watch it happen to His human half.",
    refs:"CCC 466–468" },
  { title:"The Holy Merge",
    statement:"Jesus is one unique Person. Therefore, His human soul and His divine power operate together so perfectly that they act as one single, unified divine-human energy in everything He does.",
    answer:"H", label:"Monoenergism",
    trap:"This sounds like it protects Jesus’ unity. But if His human soul and divine power merged into one energy, His human nature loses its own identity. He has two distinct ways of acting—He commands the sea to stop using His divine power, and He walks on dirt using His human muscles. They work in perfect harmony, but they do not merge into a single force.",
    refs:"CCC 475" },
  { title:"The Scars in Heaven",
    statement:"Right now, in heaven, Jesus still has a real human body — and it still bears the wounds from the nails and the spear.",
    answer:"O", label:"The Risen, Glorified Body",
    trap:"It sounds strange — wouldn’t heaven “fix” His wounds? But the Resurrection didn’t erase Jesus’ humanity; it glorified it. The risen Jesus told Thomas to touch His wounds, and He ascended to the Father body and soul. He is fully God and fully man forever. The Church’s tradition (St. Thomas Aquinas) teaches that His wounds remain — now as signs of victory, not weakness.",
    refs:"CCC 645, 659 · John 20:27" },
  { title:"The Scriptural Quote",
    statement:"In the Gospel of John, Jesus says, ‘The Father is greater than I.’ Therefore, within the Holy Trinity, the Son is naturally second-in-command and yields ultimate authority to the Father.",
    answer:"H", label:"Subordinationism",
    trap:"It quotes the Bible, so it feels safe! But the Church clarifies that the Father is greater than Jesus only in regard to Jesus’ human nature. In His divine nature, Jesus is 100% co-equal and co-eternal with the Father. There is no hierarchy or rank in the Trinity.",
    refs:"CCC 253–254 · John 14:28" },
  { title:"The “Perfect” Mind",
    statement:"Because Jesus is God and knows all things, His human mind possessed total, complete knowledge of the entire universe from the moment He was conceived. He never actually had to look up information or learn a new fact.",
    answer:"H", label:"Monophysite tendency (denies Christ’s real human learning)",
    trap:"We want to protect Jesus’ divinity, so we assume He knew everything all the time. But the Bible says Jesus “grew in wisdom” (Luke 2:52). If His human brain didn’t genuinely have to learn how to speak Aramaic or use a carpenter’s tool through practice, then He didn’t have a real human brain.",
    refs:"CCC 472–474 · Luke 2:52" },
  { title:"Just Like Us?",
    statement:"Jesus has a real human soul, a real human mind, and a real human heart. He was like us in absolutely everything — except sin.",
    answer:"O", label:"Council of Chalcedon (451)",
    trap:"This might sound like it makes Jesus “less” God. But taking on a full human nature takes nothing away from His divinity. The Church teaches He is “like us in all things but sin” (Hebrews 4:15). He got tired, hungry, and wept at Lazarus’ tomb. The Church Fathers put it this way: whatever part of being human Jesus did not take on, He could not heal.",
    refs:"CCC 467, 470–471 · Hebrews 4:15" },
  { title:"The No-Conflict Clause",
    statement:"Because Jesus never sinned and always did what was right, He didn’t have a human free will that could make choices or feel desires. His actions were always directed solely by His divine will.",
    answer:"H", label:"Monothelitism",
    trap:"We assume that having a human will means having a desire to sin. But the Church teaches that a human will is a natural part of being human. Jesus had a real human will, which is why He experienced a genuine agonizing struggle in the Garden of Gethsemane when He prayed, “Not my will, but Yours be done.” He chose to align His human will with His divine will.",
    refs:"CCC 475, 612 · Luke 22:42" },
  { title:"The Earthly Beginning",
    statement:"The Second Person of the Holy Trinity has always existed from all eternity. However, the human person named Jesus did not exist until He was conceived in the womb of the Virgin Mary.",
    answer:"H", label:"Nestorianism",
    trap:"This is incredibly deceptive. It seems correct because His human body started in Mary’s womb. The error is the phrase “the human person named Jesus.” There is no human person named Jesus. There is only one Person in Christ—the Divine Person of the Son, who took on a human nature.",
    refs:"CCC 466, 468" },
  { title:"God Was Hungry",
    statement:"It is true and correct to say that God was born in Bethlehem, God was hungry, and God died on the Cross.",
    answer:"O", label:"One Person — the “Communication of Idioms”",
    trap:"It sounds shocking — can God die? In His divine nature, no. But because Jesus is one Divine Person, everything that happens in His human nature truly happens to Him — and He is God. So we rightly say “God was born” and “God died.” The Church even says that “one of the Trinity” was crucified in the flesh.",
    refs:"CCC 468–470" },
  { title:"The Divine Switch",
    statement:"When the Son of God became man, He temporarily laid aside His divine powers, attributes, and omniscience so that He could live a genuinely limited human life on earth.",
    answer:"H", label:"Extreme Kenoticism",
    trap:"This sounds humble and heroic, but God cannot stop being God, even for a moment. If Jesus laid aside His divinity, the universe would have collapsed, because the Son sustains all creation. He didn’t give up His divinity; He chose to hide its glory under the veil of weak human flesh.",
    refs:"CCC 464, 469" }
];

const PREFIX = "belen-ohgame-v1-";
const PEER_OPTS = { config: { iceServers: [
  { urls: ["stun:stun.l.google.com:19302", "stun:stun1.l.google.com:19302", "stun:stun.cloudflare.com:3478"] },
  { urls: ["turn:eu-0.turn.peerjs.com:3478", "turn:us-0.turn.peerjs.com:3478"], username: "peerjs", credential: "peerjsp" },
  { urls: ["turn:openrelay.metered.ca:80", "turn:openrelay.metered.ca:443", "turns:openrelay.metered.ca:443?transport=tcp"], username: "openrelayproject", credential: "openrelayproject" }
] } };
const WORD = {O:"Orthodox", H:"Heresy"};
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function titleFor(pct){
  if (pct >= 100) return {t:"Doctor of the Church", d:"Flawless. St. Athanasius would be proud."};
  if (pct >= 75)  return {t:"Council Father", d:"You’d hold your own at Chalcedon."};
  if (pct >= 50)  return {t:"Faithful Catechumen", d:"Solid — but a few traps got you."};
  if (pct >= 25)  return {t:"Under Investigation", d:"The Council would like a word with you."};
  return {t:"Heresiarch", d:"Founder of your own heresy! Back to the Catechism."};
}
function baseURL(){ return location.href.split("#")[0].split("?")[0]; }

/* ============================ HOST ============================ */
const H = { peer:null, code:null, phase:"lobby", round:-1, players:{}, kicked:[], conns:{},
            timerSec:20, autoReveal:true, qStart:0, deadline:0, tick:null, showAll:false, retries:0 };

function hostSave(){
  const players = {};
  for (const [k,p] of Object.entries(H.players)) players[k] = {pid:p.pid,name:p.name,votes:p.votes};
  store.set("oh_host", {code:H.code, phase:H.phase, round:H.round, players, kicked:H.kicked,
    timerSec:H.timerSec, autoReveal:H.autoReveal, deadline:H.deadline, qStart:H.qStart, saved:Date.now()});
}
function hostBegin(resume){
  if (typeof Peer === "undefined"){ $app.innerHTML = `<div class="center"><h2>Couldn’t load the game engine.</h2><p class="muted">Check the internet connection and reload.</p></div>`; return; }
  if (resume){
    Object.assign(H, {code:resume.code, phase:resume.phase, round:resume.round, kicked:resume.kicked||[],
      timerSec:resume.timerSec, autoReveal:resume.autoReveal, deadline:resume.deadline, qStart:resume.qStart});
    H.players = {};
    for (const [k,p] of Object.entries(resume.players||{})) H.players[k] = {...p, online:false};
  } else {
    H.code = String(Math.floor(1000 + Math.random()*9000));
  }
  $app.innerHTML = `<div class="center"><div class="spin"></div><p class="muted">Opening game room…</p></div>`;
  openHostPeer(!!resume);
}
function openHostPeer(resuming){
  const peer = new Peer(PREFIX + H.code, PEER_OPTS);
  H.peer = peer;
  peer.on("open", () => { H.retries = 0; hostSave(); renderHost(); startTick(); });
  peer.on("connection", conn => {
    conn.on("data", m => onHostMsg(conn, m));
    conn.on("close", () => { if (conn.pid && H.conns[conn.pid] === conn){ delete H.conns[conn.pid]; const p=H.players[conn.pid]; if(p) p.online=false; renderHost(); } });
  });
  peer.on("disconnected", () => { try{ peer.reconnect(); }catch(e){} });
  peer.on("error", e => {
    if (e.type === "unavailable-id"){
      peer.destroy();
      if (resuming && H.retries < 8){ H.retries++; setTimeout(() => openHostPeer(true), 2500); }
      else if (!resuming){ H.code = String(Math.floor(1000 + Math.random()*9000)); openHostPeer(false); }
      else { $app.innerHTML = `<div class="center"><h2>Couldn’t reopen game ${H.code}.</h2><button class="btn" onclick="store.del('oh_host');location.reload()">Start a new game</button></div>`; }
    } else if (e.type === "network" || e.type === "server-error" || e.type === "socket-error"){
      setTimeout(() => { try{ peer.reconnect(); }catch(_){} }, 2000);
    }
  });
}
function onHostMsg(conn, m){
  if (!m || typeof m !== "object") return;
  if (m.t === "join"){
    const pid = String(m.pid||"").replace(/[^a-z0-9]/gi,"").slice(0,40); if (!pid) return;
    if (H.kicked.includes(pid)){ conn.send({t:"kicked"}); setTimeout(()=>conn.close(),300); return; }
    let p = H.players[pid];
    if (!p){
      let name = String(m.name||"").replace(/\s+/g," ").trim().slice(0,18) || "Player";
      const taken = new Set(Object.values(H.players).map(x=>x.name.toLowerCase()));
      let n = name, i = 2; while (taken.has(n.toLowerCase())) n = name + " " + (i++);
      p = H.players[pid] = {pid, name:n, votes:{}};
    }
    const old = H.conns[pid]; if (old && old !== conn){ try{ old.close(); }catch(e){} }
    conn.pid = pid; H.conns[pid] = conn; p.online = true;
    sendState(pid); hostSave(); renderHost();
  } else if (m.t === "vote"){
    const p = H.players[conn.pid]; if (!p) return;
    if (H.phase !== "question" || m.round !== H.round || p.votes[H.round]) { sendState(conn.pid); return; }
    p.votes[H.round] = {c: m.c === "O" ? "O" : "H", ms: Date.now() - H.qStart};
    sendState(conn.pid); hostSave();
    const online = Object.values(H.players).filter(x => x.online);
    if (H.autoReveal && online.length && online.every(x => x.votes[H.round])) hostReveal();
    else renderHost(true);
  }
}
function revealedCount(){ return (H.phase === "reveal" || H.phase === "final") ? H.round + 1 : Math.max(0, H.round); }
function scoreOf(p){
  let o=0,h=0,miss=0,ms=0; const n = revealedCount();
  for (let i=0;i<n;i++){
    const v = p.votes[i];
    if (!v) { miss++; continue; }
    ms += v.ms;
    if (v.c === ROUNDS[i].answer) o++; else h++;
  }
  return {o,h,miss,ms,played:n};
}
function ranked(){
  return Object.values(H.players).map(p => ({p, s:scoreOf(p)}))
    .sort((a,b) => b.s.o - a.s.o || a.s.h - b.s.h || a.s.ms - b.s.ms);
}
function stateFor(pid){
  const p = H.players[pid]; const s = scoreOf(p);
  const st = {t:"state", phase:H.phase, round:H.round, total:ROUNDS.length, name:p.name, score:s};
  if (H.phase === "question" || H.phase === "reveal"){
    const r = ROUNDS[H.round];
    st.title = r.title; st.statement = r.statement;
    st.myVote = p.votes[H.round] ? p.votes[H.round].c : null;
    if (H.phase === "question") st.secondsLeft = H.timerSec ? Math.max(0, Math.ceil((H.deadline - Date.now())/1000)) : null;
    if (H.phase === "reveal"){ st.answer = r.answer; st.label = r.label; st.trap = r.trap; st.refs = r.refs; }
  }
  if (H.phase === "final"){
    const list = ranked(); st.place = list.findIndex(x => x.p.pid === pid) + 1; st.of = list.length;
  }
  return st;
}
function sendState(pid){ const c = H.conns[pid]; if (c && c.open){ try{ c.send(stateFor(pid)); }catch(e){} } }
function broadcast(){ for (const pid of Object.keys(H.conns)) sendState(pid); }

function hostNext(){
  if (H.phase === "lobby" || H.phase === "reveal"){
    if (H.round + 1 >= ROUNDS.length){ H.phase = "final"; }
    else { H.round++; H.phase = "question"; H.qStart = Date.now(); H.deadline = H.timerSec ? Date.now() + H.timerSec*1000 : 0; }
  } else if (H.phase === "question"){ return hostReveal(); }
  hostSave(); broadcast(); renderHost();
}
function hostReveal(){ if (H.phase !== "question") return; H.phase = "reveal"; hostSave(); broadcast(); renderHost(); }
function startTick(){
  clearInterval(H.tick);
  H.tick = setInterval(() => {
    if (H.phase !== "question" || !H.timerSec) return;
    const left = Math.max(0, (H.deadline - Date.now())/1000);

    if (left <= 0) hostReveal();

function kick(pid){
  const p = H.players[pid]; if (!p) return;

  const c = H.conns[pid]; if (c){ try{ c.send({t:"kicked"}); }catch(e){} setTimeout(()=>{ try{c.close()}catch(e){} },300); delete H.conns[pid]; }

}

function doJoin(){
  const code = document.getElementById("jcode").value.trim(), name = document.getElementById("jname").value.trim();
  const err = document.getElementById("jerr");
  if (!/^\d{4}$/.test(code)) { err.textContent = "Enter the 4-digit code on the board."; return; }
  if (name.length < 2) { err.textContent = "Enter your name."; return; }
  if (typeof Peer === "undefined"){ err.textContent = "Couldn’t load the game — check Wi-Fi and reload."; return; }
  P.code = code; P.name = name; store.set("oh_last", {code, name});
  document.getElementById("jbtn").disabled = true; err.textContent = "";
  document.getElementById("jbtn").textContent = "Joining…";
  if (P.peer) { try{ P.peer.destroy(); }catch(e){} }
  P.peer = new Peer(PEER_OPTS);
  jStatus("Connecting to game server…");
  clearTimeout(P.jt); P.jt = setTimeout(joinTimeout, 25000);
  P.peer.on("open", playerConnect);
  P.peer.on("disconnected", () => { try{ P.peer.reconnect(); }catch(e){} });
  P.peer.on("error", e => {
    if (e.type === "peer-unavailable"){
      if (P.joined){ setTimeout(playerConnect, 2500); return; }
      const b = document.getElementById("jbtn"); if (b){ b.disabled=false; b.textContent="Join game"; }
      jStatus(""); clearTimeout(P.jt); const er = document.getElementById("jerr"); if (er) er.textContent = "No game found with code " + P.code + ". Check the board.";
    } else if (!P.joined){

      jStatus(""); clearTimeout(P.jt); const er = document.getElementById("jerr"); if (er) er.textContent = "Connection problem (" + e.type + "). Try again.";
    } else setTimeout(playerConnect, 2500);
  });
}
function jStatus(t){ const e = document.getElementById("jstat"); if (e) e.textContent = t; }
function joinTimeout(){
  if (P.joined) return;

  jStatus("");
  const er = document.getElementById("jerr"); if (er) er.textContent = "Couldn’t reach the board. Check the code, make sure you’re online, and try again.";
  try{ P.peer.destroy(); }catch(e){}
}
function playerConnect(){
  if (P.kicked) return;
  if (!P.joined) jStatus("Found the server — connecting to game " + P.code + "…");
  if (P.conn) { try{ P.conn.close(); }catch(e){} }
  const conn = P.peer.connect(PREFIX + P.code, {reliable:true});
  P.conn = conn;
  conn.on("open", () => { conn.send({t:"join", name:P.name, pid:P.pid}); if (P.pending){ conn.send(P.pending); } });
  conn.on("data", onPlayerMsg);
  conn.on("close", () => { if (P.conn !== conn || P.kicked) return; if (P.joined){ showBanner(true); setTimeout(playerConnect, 2000); } });
}
function onPlayerMsg(m){

  if (P.pending && (m.round !== P.pending.round || m.myVote || m.phase !== "question")) P.pending = null;

    body = `<div class="pstate"><div class="result ${cls}"><div class="big">${head}</div><div style="font-weight:800;font-size:1.2rem;margin-top:4px">${sub}</div>
      <div style="margin-top:10px">Answer: <b>${WORD[st.answer]}</b>${st.label?` — ${esc(st.label)}`:""}</div></div>
      <div class="pstatement"><div style="color:${st.answer==="O"?"var(--navy3)":"var(--red)"};font-family:Cinzel,serif;font-weight:800;margin-bottom:6px">${st.answer==="H"?"The Trap":"Why It’s True"}</div>${esc(st.trap)}
      ${st.refs?`<div class="refs">📖 ${esc(st.refs)}</div>`:""}</div>${sc}</div>`;
  } else if (st.phase === "final"){
    const pct = st.score.played ? Math.round(st.score.o / st.score.played * 100) : 0;
    const t = titleFor(pct);
    body = `<div class="pstate" style="text-align:center"><div class="muted" style="font-size:1.2rem">Your verdict</div>
      <div class="big" style="color:var(--gold);font-size:2.8rem">${esc(t.t)}</div>
      <p style="font-size:1.2rem;margin:0">${esc(t.d)}</p>
      <div style="font-size:3rem;font-family:Cinzel,serif;font-weight:800">${pct}% Orthodox</div>
      ${sc}
      <p style="font-size:1.2rem">Place: <b>${st.place}</b> of ${st.of}</p></div>`;
  }
  $app.innerHTML = `<div class="pscreen">${top}${body}</div>`;
  if (st.phase === "question" && !st.myVote && st.secondsLeft != null){
    const upd = () => { const el = document.getElementById("pcd"); if (!el) return; const s = Math.max(0, Math.ceil((P.deadline-Date.now())/1000)); el.textContent = "⏱ " + s + "s"; };
    upd(); P.cd = setInterval(upd, 250);
  }
}

/* ============================ BOOT ============================ */
function boot(){
  if (location.hash === "#host"){
    const saved = store.get("oh_host");
    if (saved && saved.phase !== "final" && Date.now() - (saved.saved||0) < 6*3600*1000){
      $app.innerHTML = `<div class="center"><div class="logo" style="font-size:3rem;margin-bottom:20px"><span class="o">Orthodoxy</span> or <span class="h">Heresy?</span></div>
        <div class="card" style="max-width:460px"><h3 style="margin-top:0">Game ${esc(saved.code)} is still in progress</h3>
        <p>${Object.keys(saved.players||{}).length} players · ${saved.phase==="lobby"?"in the lobby":"round "+(saved.round+1)}</p>
        <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn" id="bRes">Resume it</button>
        <button class="btn ghost" style="color:var(--navy);border-color:var(--navy)" id="bNew">Start new game</button></div></div></div>`;
      document.getElementById("bRes").onclick = () => hostBegin(saved);
      document.getElementById("bNew").onclick = () => { store.del("oh_host"); hostBegin(null); };
    } else hostBegin(null);
  } else playerStart();
}
boot();
</script>
</body>
